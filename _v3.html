<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>кадр: три светлых варианта</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#b8adc4;padding:16px;display:flex;gap:14px;justify-content:center;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
  .col{display:flex;flex-direction:column;align-items:center;gap:7px}
  .frame{position:relative;width:320px;height:600px;overflow:hidden;border-radius:3px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 24px}
  .frame canvas,.frame img{position:absolute;inset:0;width:100%;height:100%}
  .txt{position:relative;z-index:3;font-size:18px;line-height:1.4;max-width:18ch}
  .lbl{font-size:11px;letter-spacing:.12em;color:#3a2a44;text-transform:uppercase;text-align:center;font-weight:600}
  .note{margin-top:18px;color:#3a2a44;font-size:13px;max-width:1100px;line-height:1.6}
</style></head>
<body>
  <div class="col"><div class="frame" id="f1"><canvas id="a"></canvas><div class="txt" id="t1"></div></div><div class="lbl">A · печать на бумаге (ascii, светлое)</div></div>
  <div class="col"><div class="frame" id="f2"><canvas id="b"></canvas><div class="txt" id="t2"></div></div><div class="lbl">B · дуотон с воздухом</div></div>
  <div class="col"><div class="frame" id="f3"><img id="c"><div class="txt" id="t3"></div></div><div class="lbl">C · тёплый снимок с зерном</div></div>
  <p class="note" id="note"></p>
<script>
var SRC = "scenes/09-chai.jpg";
var TEXT = "чай у окна. без телефона, без спешки.";
["t1","t2","t3"].forEach(function(id){ document.getElementById(id).textContent = TEXT; });

var img = new Image();
img.onload = function () {

  // ---------- A: печать на бумаге (ascii, инверсия) ----------
  (function () {
    var cv = document.getElementById("a"), W = 320, H = 600;
    var cw = 8, ch = Math.round(cw * 1.62);
    var cols = Math.round(W / cw), rows = Math.floor(H / ch);
    cv.width = cols * cw; cv.height = rows * ch;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#f6efe6"; ctx.fillRect(0, 0, cv.width, cv.height);
    var oc = document.createElement("canvas"); oc.width = cols; oc.height = rows;
    var octx = oc.getContext("2d"); octx.drawImage(img, 0, 0, cols, rows);
    var d = octx.getImageData(0, 0, cols, rows).data;
    var chars = "@%#*+=-:. ";   // плотный -> пустой
    ctx.font = Math.round(ch * 0.94) + "px 'Consolas','DejaVu Sans Mono',monospace";
    ctx.textBaseline = "middle";
    for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
      var i = (y * cols + x) * 4;
      var lum = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255;
      var r = d[i]/255, g = d[i+1]/255, b = d[i+2]/255;
      var ink = 1 - lum;                       // тёмное = плотнее
      var c = chars[Math.min(chars.length-1, Math.floor(ink * chars.length))];
      if (c === " ") continue;
      // цвет: тёмное — сливовый, светлое — розовый
      var col = "rgba(" + Math.round(60 + r*140) + "," + Math.round(26 + g*60) + "," + Math.round(70 + b*90) + "," + (0.35 + ink*0.6) + ")";
      ctx.fillStyle = col;
      ctx.fillText(c, x*cw, y*ch + ch/2);
    }
  })();

  // ---------- B: дуотон с воздухом ----------
  (function () {
    var cv = document.getElementById("b"), W = 320, H = 600;
    cv.width = W; cv.height = H;
    var ctx = cv.getContext("2d");
    var oc = document.createElement("canvas"); oc.width = W; oc.height = H;
    var octx = oc.getContext("2d"); octx.drawImage(img, 0, 0, W, H);
    var d = octx.getImageData(0, 0, W, H).data;
    var out = ctx.createImageData(W, H);
    for (var p = 0; p < d.length; p += 4) {
      var lum = (d[p]*0.299 + d[p+1]*0.587 + d[p+2]*0.114) / 255;
      lum = Math.pow(lum, 0.82);                       // поднять света
      lum = lum * 0.86 + 0.14;                         // воздух: подмешать бумагу
      // тени: тёплый сливовый (58,38,58)  →  света: бумага (250,243,235)
      out.data[p]   = Math.round(58  + (250 - 58)  * lum);
      out.data[p+1] = Math.round(38  + (243 - 38)  * lum);
      out.data[p+2] = Math.round(58  + (235 - 58)  * lum);
      out.data[p+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    // розовая подсветка сверху
    var g = ctx.createRadialGradient(W*0.72, H*0.16, 8, W*0.72, H*0.16, W*0.9);
    g.addColorStop(0, "rgba(232,93,168,.22)");
    g.addColorStop(1, "rgba(232,93,168,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  })();

  // ---------- C: тёплый снимок ----------
  document.getElementById("c").src = SRC;

  document.title = "OK";
};
img.src = SRC;
</script>
</body></html>
